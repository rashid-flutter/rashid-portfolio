<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Rashid V | Flutter Developer Kerala | Firebase & Cross Platform Apps
    </title>

    <meta
      name="description"
      content="Rashid V is a Flutter Developer from Kerala, India building Firebase applications, responsive websites, and cross-platform mobile apps with modern UI/UX."
    />

    <meta
      name="keywords"
      content="Rashid V, Flutter Developer Kerala, Flutter Developer India, Firebase Developer, Cross Platform App Developer, Flutter Portfolio"
    />

    <meta
      name="author"
      content="Rashid V"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="theme-color"
      content="#030014"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://rashidv.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/my---pica.png"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://rashidv.vercel.app/"
    />

    <meta
      property="og:title"
      content="Rashid V | Flutter Developer"
    />

    <meta
      property="og:description"
      content="Portfolio of Rashid V — Flutter Developer specializing in Firebase apps, mobile applications, and modern UI/UX."
    />

    <meta
      property="og:image"
      content="https://rashidv.vercel.app/Meta.png"
    />

    <meta
      property="og:site_name"
      content="Rashid V Portfolio"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:url"
      content="https://rashidv.vercel.app/"
    />

    <meta
      name="twitter:title"
      content="Rashid V | Flutter Developer"
    />

    <meta
      name="twitter:description"
      content="Flutter Developer portfolio showcasing Firebase apps, responsive web apps, and mobile projects."
    />

    <meta
      name="twitter:image"
      content="https://rashidv.vercel.app/Meta.png"
    />

    <!-- PWA / Mobile -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rashid V",
        "url": "https://rashidv.vercel.app/",
        "image": "https://rashidv.vercel.app/Meta.png",
        "jobTitle": "Flutter Developer",
        "description": "Flutter Developer specializing in Firebase applications and cross-platform mobile app development.",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Kerala",
          "addressCountry": "India"
        },
        "sameAs": [
          "https://github.com/rashid-flutter"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
